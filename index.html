<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customizable Image Generator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Customizable Image Generator</h1>
    <form id="image-form">
      <label for="text-input">Enter the text you want to display:</label>
      <textarea id="text-input" rows="3" placeholder="Enter your text here"></textarea>
      <button type="submit">Generate Image</button>
    </form>
    <div id="image-container"></div>
    <div class="controls">
      <div class="input-group">
        <label for="title-input">Title</label>
        <input type="text" id="title-input" placeholder="Enter title (optional)" class="text-input">
      </div>

      <div class="slider-group">
        <label for="fontSize">Font Size (24-60px)</label>
        <input type="range" id="fontSize" min="24" max="60" value="42" class="slider">
        <span class="slider-value" id="fontSizeValue">42px</span>
      </div>
      
      <div class="slider-group">
        <label for="margin">Margins (10-30%)</label>
        <input type="range" id="margin" min="10" max="30" value="20" class="slider">
        <span class="slider-value" id="marginValue">20%</span>
      </div>
      
      <div class="slider-group">
        <label for="contentWidth">Content Width (50-80%)</label>
        <input type="range" id="contentWidth" min="50" max="80" value="70" class="slider">
        <span class="slider-value" id="contentWidthValue">70%</span>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
